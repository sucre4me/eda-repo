---
- name: Monitor Zabbix Disk Space Events
  hosts: all
  sources:
    - ansible.eda.webhook:
        host: 0.0.0.0
        port: 5000
  rules:
    - name: Remediate High var log Disk Usage
      # 🌟 FIXED: Changed 'matches' to 'match' and removed the escaping backslashes
      condition: event.payload.event_name match ".*"/var/log".*"
      action:
        run_job_template:
          name: "Remediate Disk Space Playbook"
          organization: "Default"
          job_args:
            extra_vars:
              target_host: "{{ event.payload.host_ip }}"
              zabbix_event_id: "{{ event.payload.event_id }}"

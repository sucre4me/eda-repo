---
- name: Monitor Zabbix Disk Space Events
  hosts: all
  sources:
    - ansible.eda.webhook:
        host: 0.0.0.0
        port: 5000
  rules:
    - name: Remediate High var log Disk Usage
      # 🌟 ENTERPRISE RECONCILIATION: Escaped regex handles brackets and paths cleanly
      condition: event.payload.event_name matches ".*\\/var\\/log.*"
      action:
        run_job_template:
          name: "Remediate Disk Space Playbook"
          organization: "Default"
          job_args:
            extra_vars:
              target_host: "{{ event.payload.host_ip }}"
              zabbix_event_id: "{{ event.payload.event_id }}"

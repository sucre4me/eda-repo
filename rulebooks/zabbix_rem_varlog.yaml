---
- name: Monitor Zabbix Disk Space Events
  hosts: all
  sources:
    - ansible.eda.webhook:
        host: 0.0.0.0
        port: 5000
  rules:
    - name: Remediate High /var/log Disk Usage
      # Triggers if the alert mentions '/var/log' and the severity metrics are high
      condition: >
        event.payload.event_name contains "/var/log" or 
        event.payload.trigger_description contains "/var/log"
      action:
        run_job_template:
          name: "Remediate Disk Space Playbook"
          organization: "Default"
          job_args:
            extra_vars:
              target_host: "{{ event.payload.host_host }}"
              zabbix_event_id: "{{ event.payload.event_id }}"

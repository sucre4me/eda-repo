---
- name: Capture Zabbix Monitoring Events
  hosts: all
  sources:
    - ansible.eda.webhook:
        host: 0.0.0.0
        port: 5000
  rules:
    - name: Catch-all Zabbix Problem Alerts
      # 🌟 CHANGE THIS LINE to look for root fields sent by Zabbix
      condition: event.event_id is defined
      action:
        debug:
          msg: "Successfully caught Zabbix alert ID {{ event.event_id }} for host {{ event.host_host }}"

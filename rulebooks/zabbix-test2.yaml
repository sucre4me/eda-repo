
---
- name: Monitor Zabbix Disk Space Events
  hosts: all

  sources:
    - ansible.eda.webhook:
        host: 0.0.0.0
        port: 5000

  rules:
    - name: Test Zabbix Disk Space Matching

      condition: event.payload.event_name is defined

      action:
        debug:
          msg: "Zabbix event received and matched successfully"

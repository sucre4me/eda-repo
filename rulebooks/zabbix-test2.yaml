
---
- name: Monitor Zabbix Disk Space Events
  hosts: all

  sources:
    - ansible.eda.webhook:
        host: 0.0.0.0
        port: 5000

  rules:
    - name: Remediate High /var/log Disk Usage

      condition: >
        event.payload.event_name contains "/var/log" or
        event.payload.trigger_name contains "/var/log"

      action:

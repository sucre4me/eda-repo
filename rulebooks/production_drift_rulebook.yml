---
- name: Enterprise Production Fleet Drift Remediation
  hosts: all
  sources:
    - ansible.eda.webhook:
  rules:
    - name: Catch Prometheus Fleet Alert and Auto Heal
      condition: event.payload.alerts.labels.alertname == "ConfigurationDriftDetected"
      action:
        run_job_template:
          name: "Demo - Remediate Drift"
          organization: "Default"
          job_args:
            extra_vars:
              # Strips the protocol prefix and resource path to isolate the target IP address
              eda_drifted_host: "{{ event.payload.alerts.labels.instance | regex_replace('^https?://', '') | regex_replace('/.*$', '') }}"


---
- name: Production Remediation - Enforce Secure Baseline
  hosts: "{{ eda_drifted_host | default('192.168.9.159') }}"
  gather_facts: false
  become: true
  tasks:
    - name: Enforce declarative configuration state over SSH
      ansible.builtin.template:
        src: templates/index.html.j2
        dest: /var/www/html/index.html
        owner: apache
        group: apache
        mode: '0644'

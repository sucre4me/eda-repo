---
- name: Disk Remediation Playbook for /var/log (Zabbix Integrated)
  hosts: "{{ target_host | default('all') }}"
  become: True
  become_method: sudo
  gather_facts: no
  
  tasks:
    - name: Find and truncate all .log files in /var/log larger than 100MB
      ansible.builtin.shell: |
        find /var/log -name "*.log" -size +100M -exec truncate -s 0 {} \;
      register: cleanup_output
      changed_when: cleanup_output.rc == 0

    - name: Log remediation success context
      ansible.builtin.debug:
        msg: "Successfully cleaned /var/log on IP {{ target_host | default(inventory_hostname) }} for Zabbix Event ID {{ zabbix_event_id | default('Manual_Run') }}"

---
- name: Automatically Trim /var/log Files
  hosts: all
  become: true
  gather_facts: true

  tasks:
    - name: Verify active /var/log disk usage utilization percentage
      set_fact:
        log_disk_usage: "{{ item.mount == '/var' | ternary(item.size_available / item.size_total * 100, omit) }}"
      loop: "{{ ansible_facts.mounts }}"
      when: item.mount == '/var' or item.mount == '/'

    - name: Collect large or un-rotated log files
      find:
        paths: /var/log
        size: 50M
        recurse: yes
      register: large_logs

    - name: Safely truncate logs above size thresholds
      shell: "truncate -s 0 {{ item.path }}"
      loop: "{{ large_logs.files }}"
      when: large_logs.matched > 0
      register: truncate_status

    - name: Acknowledge and resolve the alert back inside Zabbix
      debug:
        msg: "Cleaned up host {{ target_host }} for Zabbix Incident ID {{ zabbix_event_id }}"

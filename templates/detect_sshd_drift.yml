
---
- name: AAP 2.7 Agentless SSHD Configuration Drift Detection
  hosts: all
  become: true
  gather_facts: false

  vars:
    eda_event_stream_url: "https://gateway.teneceocp.com:443/eda-event-streams/api/eda/v1/external_event_stream/b393f7e7-40b9-4ca8-836a-821338a054bd/post/"

    eda_token: "{{ lookup('ansible.builtin.env', 'EDA_EVENT_STREAM_TOKEN') }}"

  tasks:

    # Step 1: Compare remote SSHD configuration with golden baseline
    - name: Detect SSHD configuration drift
      ansible.builtin.template:
        src: sshd_config.j2
        dest: /etc/ssh/sshd_config
        owner: root
        group: root
        mode: '0600'
        validate: '/usr/sbin/sshd -t -f %s'
      check_mode: true
      diff: false
      register: sshd_drift

    # Step 2: Confirm the EDA token is available
    - name: Verify EDA authentication token
      ansible.builtin.assert:
        that:
          - eda_token is defined
          - eda_token | length > 0
        fail_msg: "EDA token is missing. Check the AAP custom credential."
        success_msg: "EDA authentication token is available."
      delegate_to: localhost
      become: false
      no_log: false

    # Step 3: Send drift event to AAP EDA external event stream
    - name: Send SSHD drift event to EDA
      ansible.builtin.uri:
        url: "{{ eda_event_stream_url }}"
        method: POST
        headers:
          Authorization: "{{ eda_token }}"
          Content-Type: application/json
        body_format: json
        body:
          payload:
            status: drifted
            config_item: SSHD_CONFIGURATION
            hostname: "{{ inventory_hostname }}"
            baseline: golden
            detected_by: AAP_2.7_AGENTLESS
        validate_certs: false
        status_code:
          - 200
          - 201
          - 202
          - 204
        return_content: true
      register: eda_response
      when: sshd_drift.changed
      delegate_to: localhost
      become: false
      no_log: true

    # Step 4: Report successful event submission
    - name: Confirm drift event submission
      ansible.builtin.debug:
        msg: "Drift event submitted to EDA for {{ inventory_hostname }}"
      when:
        - sshd_drift.changed
        - eda_response is defined
        - eda_response.status is defined

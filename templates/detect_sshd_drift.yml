
---
- name: Agentless SSHD Configuration Drift Detection
  hosts: all
  become: true
  gather_facts: false

  vars:
    eda_event_stream_url: >-
      https://gateway.teneceocp.com:443/eda-event-streams/api/eda/v1/external_event_stream/b393f7e7-40b9-4ca8-836a-821338a054bd/post/

    eda_token: "{{ lookup('ansible.builtin.env', 'EDA_EVENT_STREAM_TOKEN') }}"

  tasks:

    - name: Compare current SSHD configuration with golden baseline
      ansible.builtin.template:
        src: ../templates/sshd_config.j2
        dest: /etc/ssh/sshd_config
        owner: root
        group: root
        mode: '0600'
        validate: '/usr/sbin/sshd -t -f %s'
      check_mode: true
      register: sshd_drift
      diff: false

- name: Verify EDA token is available
  ansible.builtin.assert:
    that:
      - eda_token is defined
      - eda_token | length > 0
    fail_msg: "EDA token is missing from the execution environment."
    success_msg: "EDA token is available."
  no_log: false
  delegate_to: localhost
  become: false

    - name: Send SSHD configuration drift event to EDA
      ansible.builtin.uri:
        url: "{{ eda_event_stream_url }}"
        method: POST
        headers:
          Authorization: "{{ eda_token }}"
          Content-Type: application/json
        body_format: json
        body:
          payload:
            status: drifted
            config_item: PermitRootLogin
            hostname: "{{ inventory_hostname }}"
            baseline: "golden"
            detected_by: "AAP 2.7 agentless drift detection"
        validate_certs: true
        status_code:
          - 200
          - 201
          - 202
          - 204
      when: sshd_drift.changed
      delegate_to: localhost
      become: false
      no_log: true

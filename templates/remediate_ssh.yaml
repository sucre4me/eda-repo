---
- name: AAP 2.7 Enforce Entire Golden SSHD Baseline Image
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Overwrite configuration with complete pristine golden template
      ansible.builtin.template:
        src: sshd_config.j2
        dest: /etc/ssh/sshd_config
        owner: root
        group: root
        mode: '0600'
        validate: '/usr/sbin/sshd -t -f %s'
      register: golden_sshd

    - name: Restart sshd service to force compliance
      ansible.builtin.systemd_service:
        name: sshd
        state: restarted
      when: golden_sshd.changed
